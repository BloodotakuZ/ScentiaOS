---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia
description: ScentiaOS - Local Bazzite NVIDIA Open Hyprland Build

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:
  # ==========================================================
  # Hyprland / desktop packages
  # ==========================================================

  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland

    install:
      packages:
        - hyprland
        - noctalia
        - uwsm

        - kitty
        - Thunar

        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk

  # ==========================================================
  # Scentia configuration
  # ==========================================================

  - type: files
    files:
      - source: system
        destination: /

  # Replace Bazzite/Terra WirePlumber 0.5.17 with Fedora's newer build.
  # 0.5.18 fixes Bluetooth HFP capture dying after profile switching.
  - type: dnf
    replace:
      - from-repo: updates
        allow-erasing: true
        packages:
          - old: terra-wireplumber
            new: wireplumber
          - old: terra-wireplumber-libs
            new: wireplumber-libs
