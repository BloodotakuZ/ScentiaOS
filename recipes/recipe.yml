---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia
description: ScentiaOS - Local Bazzite NVIDIA Open Hyprland Build

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland

    install:
      packages:
        # Desktop
        - hyprland
        - noctalia
        - uwsm

        # Applications
        - kitty
        - Thunar

        # Desktop integration
        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
