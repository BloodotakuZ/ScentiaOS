---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia-stock-kernel-test
description: ScentiaOS - Bluetooth A/B test using stock Bazzite NVIDIA Open kernel

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:

  # ==========================================================
  # IMPORTANT:
  # No CachyOS kernel replacement in this image.
  # The stock Bazzite kernel + NVIDIA Open stack is retained.
  # ==========================================================


  # ==========================================================
  # Scentia desktop
  # ==========================================================

  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland
        - ilyaz/LACT

    install:
      packages:
        - hyprland
        - noctalia
        - lact
        - uwsm

        - kitty
        - Thunar

        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk


  # ==========================================================
  # Same Bluetooth/audio stack as scentia-cachy
  # ==========================================================

  - type: script
    scripts:
      - fix-wireplumber.sh
      - fix-bluez.sh


  # ==========================================================
  # Scentia configuration
  # ==========================================================

  - type: files
    files:
      - source: system
        destination: /


  # ==========================================================
  # LACT GPU control daemon
  # ==========================================================

  - type: systemd
    system:
      enabled:
        - lactd.service


  # ==========================================================
  # Heroic Games Launcher
  # ==========================================================

  - type: script
    no-cache: true
    scripts:
      - install-heroic.sh
