---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia-stock-kernel-test
description: ScentiaOS - Bluetooth A/B test using stock Bazzite NVIDIA Open kernel

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:

  # Keep the stock Bazzite kernel and NVIDIA Open stack

  # Fix Terra Xwayland conflict before Hyprland installation
  - type: dnf
    replace:
      - from-repo: updates
        packages:
          - old: terra-xorg-x11-server-Xwayland
            new: xorg-x11-server-Xwayland

  # Scentia desktop
  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland
        - ilyaz/LACT

    install:
      packages:
        - hyprland
        - noctalia
        - lact
        - uwsm
        - kitty
        - Thunar
        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk

  # Bluetooth and audio fixes
  - type: script
    scripts:
      - fix-wireplumber.sh
      - fix-bluez.sh

  # Scentia configuration
  - type: files
    files:
      - source: system
        destination: /

  # LACT service
  - type: systemd
    system:
      enabled:
        - lactd.service

  # Heroic Games Launcher
  - type: script
    no-cache: true
    scripts:
      - install-heroic.sh
