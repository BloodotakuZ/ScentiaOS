---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia-cachy
description: ScentiaOS - Bazzite NVIDIA Open with CachyOS kernel

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:

  # ==========================================================
  # CachyOS kernel + locally rebuilt NVIDIA Open modules
  # ==========================================================

  - type: script
    scripts:
      - install-cachy-kernel.sh


  # ==========================================================
  # Scentia desktop
  # ==========================================================

  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland
        - ilyaz/LACT

    install:
      packages:
        - hyprland
        - noctalia
        - lact
        - uwsm

        - kitty
        - Thunar

        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk


  # ==========================================================
  # WirePlumber
  # Replace Bazzite/Terra 0.5.17 with Fedora 0.5.18+
  # ==========================================================

  - type: script
    scripts:
      - fix-wireplumber.sh


  # ==========================================================
  # Scentia configuration
  # ==========================================================

  - type: files
    files:
      - source: system
        destination: /


  # ==========================================================
  # Rebuild initramfs AFTER kernel and NVIDIA changes
  # ==========================================================

  - type: initramfs


  # ==========================================================
  # LACT GPU control daemon
  # ==========================================================

  - type: systemd
    system:
      enabled:
        - lactd.service


  # ==========================================================
  # Heroic Games Launcher
  # Latest official upstream RPM
  # ==========================================================

  - type: script
    no-cache: true
    scripts:
      - install-heroic.sh
