---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: scentia-cachy
description: ScentiaOS - Bazzite NVIDIA Open testing + Bazzite DX tooling + CachyOS kernel

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: testing

blue-build-tag: none
cosign-version: none
nushell-version: none

modules:

  # Bazzite DX developer tooling
  - type: script
    scripts:
      - install-bazzite-dx.sh

  # CachyOS kernel and NVIDIA Open modules
  - type: script
    scripts:
      - install-cachy-kernel.sh

  # Fix Terra Xwayland conflict before Hyprland installation
  - type: dnf
    replace:
      - from-repo: updates
        packages:
          - old: terra-xorg-x11-server-Xwayland
            new: xorg-x11-server-Xwayland

  # Scentia desktop
  - type: dnf
    repos:
      cleanup: true
      copr:
        - giperborey/Hyprland
        - ilyaz/LACT

    install:
      packages:
        - hyprland
        - noctalia
        - lact
        - uwsm
        - kitty
        - Thunar
        - xdg-utils
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk

  # WirePlumber and Bluetooth fixes
  - type: script
    scripts:
      - fix-wireplumber.sh
      - fix-bluez.sh

  # Scentia configuration
  - type: files
    files:
      - source: system
        destination: /

  # Rebuild initramfs after kernel and NVIDIA changes
  - type: initramfs

  # Scentia and DX services
  - type: systemd
    system:
      enabled:
        - lactd.service
        - docker.socket
        - podman.socket
        - ublue-system-setup.service

  # Heroic Games Launcher
  - type: script
    no-cache: true
    scripts:
      - install-heroic.sh
